<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Road to Stardom — Modo Carreira de Jogador</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Tela inicial -->
    <section id="screen-start" class="screen active">
      <div class="hero">
        <h1>⚽ ROAD TO STARDOM</h1>
        <p class="subtitle">Modo Carreira de Jogador — da base à lenda mundial</p>
        <div class="hero-buttons">
          <button id="btn-new" class="btn primary big">Nova carreira</button>
          <button id="btn-continue" class="btn big" hidden>Continuar carreira</button>
          <button id="btn-import" class="btn small-btn">Importar save</button>
          <input type="file" id="import-file" accept=".json" hidden>
        </div>
      </div>
    </section>

    <!-- Criação do jogador -->
    <section id="screen-create" class="screen">
      <h2>Crie seu jogador</h2>
      <form id="create-form" class="create-grid">
        <label>Nome
          <input name="firstName" required maxlength="20" placeholder="Ex.: Pedro">
        </label>
        <label>Sobrenome
          <input name="lastName" required maxlength="20" placeholder="Ex.: Silva">
        </label>
        <label>Idade inicial
          <select name="age"></select>
        </label>
        <label>Nacionalidade
          <select name="nationality"></select>
        </label>
        <label>País onde inicia a carreira
          <select name="country"></select>
        </label>
        <label>Pé dominante
          <select name="foot">
            <option>Direito</option>
            <option>Esquerdo</option>
            <option>Ambidestro</option>
          </select>
        </label>
        <label>Posição
          <select name="position"></select>
        </label>
        <label>Altura (cm)
          <input name="height" type="number" min="160" max="205" value="178">
        </label>
        <label>Número da camisa preferido
          <input name="shirt" type="number" min="1" max="99" value="10">
        </label>
        <label>Estilo de jogador
          <select name="style"></select>
        </label>
        <div class="form-actions">
          <button type="button" id="btn-back-start" class="btn">Voltar</button>
          <button type="submit" class="btn primary">Continuar para o sorteio da base →</button>
        </div>
      </form>
    </section>

    <!-- Roleta da academia -->
    <section id="screen-roll" class="screen">
      <h2>Sorteio da academia</h2>
      <p class="muted">Olheiros de <span id="roll-country"></span> avaliaram você. Gire a roleta para descobrir qual clube abrirá as portas da base. Academias de elite são raras!</p>
      <div id="roulette" class="roulette">
        <div id="roulette-display" class="roulette-display">?</div>
      </div>
      <div id="roll-result" class="roll-result" hidden>
        <h3 id="roll-club"></h3>
        <p id="roll-text"></p>
        <div class="roll-stats">
          <div class="stat-chip">Categoria<br><strong id="roll-cat"></strong></div>
          <div class="stat-chip">Academia<br><strong id="roll-academy"></strong></div>
          <div class="stat-chip">Overall inicial<br><strong id="roll-ovr"></strong></div>
          <div class="stat-chip">Potencial<br><strong id="roll-pot"></strong></div>
        </div>
      </div>
      <div class="form-actions">
        <button id="btn-roll" class="btn primary big">🎰 Roletar</button>
        <button id="btn-reroll" class="btn" hidden>Roletar novamente</button>
        <button id="btn-accept-roll" class="btn primary" hidden>Aceitar e começar carreira ✔</button>
      </div>
    </section>

    <!-- Hub da carreira -->
    <section id="screen-career" class="screen">
      <header id="career-header" class="career-header"></header>
      <nav id="career-tabs" class="tabs"></nav>
      <main id="tab-content" class="tab-content"></main>
      <footer class="actions-bar">
        <button id="btn-advance" class="btn primary">▶ Avançar semana</button>
        <button id="btn-advance4" class="btn">⏩ Avançar mês</button>
        <button id="btn-save" class="btn small-btn">💾 Salvar</button>
        <button id="btn-export" class="btn small-btn">⬇ Exportar</button>
      </footer>
    </section>

    <!-- Aposentadoria -->
    <section id="screen-retired" class="screen">
      <div id="retired-summary"></div>
      <div class="form-actions">
        <button id="btn-retired-new" class="btn primary big">Começar nova carreira</button>
      </div>
    </section>
  </div>

  <!-- Modal de eventos (resultado de partida etc.) -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div id="modal-content"></div>
      <button id="modal-close" class="btn primary">Continuar</button>
    </div>
  </div>

  <script type="module" src="src/ui/app.js"></script>
</body>
</html>
